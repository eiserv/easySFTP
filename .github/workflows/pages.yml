name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "benchmarks/analysis/out/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the site and the docs, pushes nothing; the Pages deployment
      # below uses its own OIDC token, not the checkout's (issue #283).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site
        # The site renders the repo's own markdown; copy it in so the
        # published docs always match the checked-out revision.
        run: |
          mkdir -p _site/content
          cp -r site/. _site/
          cp docs/configuration.md docs/tuning.md docs/strategies.md \
             docs/examples.md docs/security.md docs/troubleshooting.md \
             docs/providers.md docs/migration-v3.md _site/content/
          cp CONTRIBUTING.md _site/content/contributing.md
      - name: Add the benchmark graphs
        # The graphs are the committed gallery (benchmarks/analysis/README.md).
        # Their file names carry the sweep or release they were drawn from, so
        # they are copied to the stable names site/benchmarks.html refers to.
        # Exactly one file per kind: a regenerated gallery that left an old
        # file behind fails here instead of publishing the wrong figure.
        run: |
          mkdir -p _site/benchmarks
          for kind in heatmap scaling auto canary link deletes phases operations; do
            files=(benchmarks/analysis/out/"$kind"-*.png)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "expected exactly one benchmarks/analysis/out/$kind-*.png, found: ${files[*]}" >&2
              exit 1
            fi
            cp "${files[0]}" "_site/benchmarks/$kind.png"
          done
          cp benchmarks/analysis/out/trend-releases.png _site/benchmarks/trend.png
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
