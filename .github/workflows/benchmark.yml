name: SFTP benchmark

# Throughput measurement against a real SFTP server (issue #169), plus the
# bookkeeping that turns a measurement into a permanent entry in benchmarks/.
#
# It collects data only: no threshold here fails anything, since run-to-run
# variance against an external host is not understood yet.
#
# Three ways in:
#   workflow_dispatch  a manual or experimental run of any ref, or of a PR via
#                      the "pr" input. Stored as a *manual* result, which never
#                      becomes an official reference.
#   pull_request       every release PR is benchmarked once when it opens, so
#                      the numbers are visible before the merge. Nothing is
#                      stored: the release is not real yet.
#   workflow_call      release-please.yml calls this after it created a release,
#                      passing the tag as "release-version". The tagged code is
#                      measured once more, committed as the official reference,
#                      and attached to the GitHub Release as an asset (the
#                      "attach" job below).
#
# That last one is a "uses:" call and not an "on: release" trigger on purpose.
# release-please creates the GitHub Release with the GITHUB_TOKEN, and events
# raised by that token never start a workflow run, so an "on: release" job
# silently never runs. v3.3.0 shipped without its benchmark that way. The
# release-binaries pipeline is wired the same way for the same reason.
#
# Approval: the "benchmark" environment is the gate for manual and release-PR
# runs. Give it required reviewers in the repository settings, otherwise every
# account with write access can start a run against the external host. The
# automatic post-release run uses "benchmark-release", which is meant to stay
# unprotected so a release does not wait for a click.
#
# Self-hosted runner: this job runs on a fixed machine (labels self-hosted,
# Linux, X64) so results are comparable instead of landing on whatever
# GitHub-hosted region was free. It is the only job in this repository that may
# use it; every other workflow stays on GitHub-hosted runners. Three layers
# keep untrusted code off that machine, and all three are needed:
#   1. workflow_dispatch and workflow_call require write access already.
#   2. The pull_request path is restricted to release-please branches *of this
#      repository*. A fork can name its branch "release-please--anything", so
#      the head-repo check, not the branch name, is what keeps forks out.
#   3. Repository setting "Fork pull request workflows from outside
#      collaborators" must stay on "Require approval for all external
#      contributors". Without it an outside contributor can add
#      "runs-on: self-hosted" to any workflow in a fork PR and execute
#      arbitrary code on the machine; no YAML in this repository can prevent
#      that, since a pull_request run uses the workflow files from the PR.
# The runner also holds nothing sensitive by design: secrets are passed per
# run, not stored on it.
#
# Required repository secrets:
#   BENCHMARK_SFTP_HOST         host name of the benchmark server
#   BENCHMARK_SFTP_USERNAME     SFTP user name
#   BENCHMARK_SFTP_PASSWORD     SFTP password
#   BENCHMARK_SFTP_KNOWN_HOSTS  verbatim output of "ssh-keyscan <host>", so the
#                               benchmark verifies the server like any other
#                               easySFTP run does
#
# The account must be a throwaway one: everything below
# "<remote-base>/<build>/<scenario>" is wiped before every repeat and again at
# the end of the run.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to benchmark. Wins over candidate-ref."
        required: false
        type: string
      candidate-ref:
        description: "Ref (branch, tag or SHA) to benchmark. Defaults to the ref this workflow was started from."
        required: false
        type: string
      baseline-ref:
        description: "Optional second ref to benchmark in the same run, for comparison (e.g. main)."
        required: false
        type: string
      release-version:
        description: "Repairs a missed release benchmark: measures this tag and stores it as the official reference (e.g. v3.3.0). Refuses to overwrite an existing one."
        required: false
        type: string
      repeats:
        description: "Measured repeats per scenario; the median is reported."
        required: false
        default: "3"
        type: string
      connections:
        description: "Also measure the candidate with advanced.connections set to this many SSH connections (issue #158), as a third build. Empty = single connection only."
        required: false
        type: string
      link-profiles:
        description: "Network profiles to measure over, space separated (issue #184): baseline, +50ms, +50ms/5mbit, baseline/5mbit. Empty = the real line only. Shaping needs NET_ADMIN on the runner and is skipped, recorded, when it is missing."
        required: false
        default: ""
        type: string
      link-iface:
        description: "Interface to shape. Empty derives it from the route to the benchmark host."
        required: false
        default: ""
        type: string
      remote-base:
        description: "Remote directory the benchmark owns. Everything below it is disposable."
        required: false
        default: "/easysftp-benchmark"
        type: string
      port:
        description: "SFTP port of the benchmark server."
        required: false
        default: "22"
        type: string
  # Release PRs only; the job-level "if" below drops every other pull request.
  # "opened" and not "synchronize": release-please rewrites its branch on every
  # push to main, and one preview measurement per release PR is enough.
  pull_request:
    types: [opened, reopened]
  workflow_call:
    inputs:
      release-version:
        description: "Tag to benchmark and store as the official reference of that release."
        required: true
        type: string

permissions:
  contents: read

# One benchmark at a time: two runs sharing the host would measure each other,
# they would also fight over the same remote directories, and the storing step
# would race for a push to main.
concurrency:
  group: sftp-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark SFTP throughput
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'release-please--'))
    # The one job in this repo on the self-hosted runner. Everything else stays
    # on GitHub-hosted runners; see the "Self-hosted runner" note in the header.
    runs-on: [self-hosted, Linux, X64]
    # Six hours, not the one hour this used to have. A standard run of the
    # three fixed scenarios takes minutes, but the timeout is what decides
    # whether a heavier scenario set, more repeats or a second link profile can
    # be asked for at all, and a measurement killed halfway is worth nothing.
    # The sweep next door (benchmark-matrix.yml) gets a whole day for the same
    # reason.
    timeout-minutes: 360
    # The maintainer gate issue #169 asks for. See the header: protect
    # "benchmark" with required reviewers, leave "benchmark-release" open.
    # "push" is only ever release-please.yml calling this workflow; a manual
    # repair run of a release stays behind the approval like any other one.
    environment: ${{ github.event_name == 'push' && 'benchmark-release' || 'benchmark' }}
    permissions:
      # Only the release run pushes, but the token is scoped per job.
      contents: write
    steps:
      # The workflow's own checkout, for cmd/easysftp-bench. It runs first:
      # a root checkout cleans the workspace and would remove the build
      # checkouts below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve what to benchmark
        id: resolve
        env:
          # Through the environment, never interpolated into the script: these
          # are user input, and "${{ }}" in a run block is a shell injection.
          PR: ${{ inputs.pr }}
          CANDIDATE: ${{ inputs.candidate-ref }}
          VERSION: ${{ inputs.release-version }}
          FALLBACK: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION:-}" ]; then
            # Checked here and not only in the store: failing after a
            # measurement that takes minutes is a poor way to report a typo.
            case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::release-version must look like v3.3.0, got '$VERSION'"
              exit 1
              ;;
            esac
            ref=$VERSION
            label=$VERSION
          elif [ -n "${PR:-}" ]; then
            case "$PR" in
            *[!0-9]*)
              echo "::error::pr must be a number, got '$PR'"
              exit 1
              ;;
            esac
            ref=refs/pull/$PR/merge
            label=pr-$PR
          elif [ -n "${CANDIDATE:-}" ]; then
            ref=$CANDIDATE
            label=$CANDIDATE
          else
            ref=$FALLBACK
            label=${GITHUB_REF_NAME:-manual}
          fi
          {
            echo "ref=$ref"
            echo "label=$label"
            echo "recorded-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "benchmarking $ref"

      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          path: builds/candidate

      - name: Check out the baseline
        if: inputs.baseline-ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline-ref }}
          path: builds/baseline

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build both refs
        id: build
        env:
          CGO_ENABLED: "0"
          CANDIDATE_REF_INPUT: ${{ steps.resolve.outputs.ref }}
          BASELINE_REF_INPUT: ${{ inputs.baseline-ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          build() {
            local dir=$1 name=$2
            ( cd "$dir" && go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/bin/$name" ./cmd/easysftp )
          }
          build builds/candidate easysftp-candidate
          # The link probe (issue #184). Built from the workflow's own checkout,
          # not from the candidate: it measures the path, and the path must be
          # measured the same way no matter which ref is under test.
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/bin/linkprobe" ./cmd/linkprobe
          # The harness itself (issue #190). Built from the workflow's own
          # checkout for the same reason: it decides what is measured and what
          # the stored result looks like, and neither may depend on which ref is
          # under test.
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/bin/easysftp-bench" ./cmd/easysftp-bench
          candidate_sha=$(git -C builds/candidate rev-parse HEAD)
          {
            echo "candidate-ref=$CANDIDATE_REF_INPUT ($(git -C builds/candidate rev-parse --short HEAD))"
            echo "candidate-sha=$candidate_sha"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$BASELINE_REF_INPUT" ]; then
            build builds/baseline easysftp-baseline
            {
              echo "baseline-bin=$RUNNER_TEMP/bin/easysftp-baseline"
              echo "baseline-ref=$BASELINE_REF_INPUT ($(git -C builds/baseline rev-parse --short HEAD))"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run the benchmark
        env:
          CANDIDATE_BIN: ${{ runner.temp }}/bin/easysftp-candidate
          CANDIDATE_REF: ${{ steps.build.outputs.candidate-ref }}
          BASELINE_BIN: ${{ steps.build.outputs.baseline-bin }}
          BASELINE_REF: ${{ steps.build.outputs.baseline-ref }}
          REPEATS: ${{ inputs.repeats || '3' }}
          REMOTE_BASE: ${{ inputs.remote-base || '/easysftp-benchmark' }}
          BENCH_CONNECTIONS: ${{ inputs.connections }}
          BENCH_LINK_PROFILES: ${{ inputs.link-profiles }}
          LINKPROBE_BIN: ${{ runner.temp }}/bin/linkprobe
          LINK_IFACE: ${{ inputs.link-iface }}
          # OUT_DIR is uploaded as an artifact; LOG_DIR (which holds logs that
          # name the host and user) deliberately is not.
          OUT_DIR: ${{ runner.temp }}/benchmark-results
          LOG_DIR: ${{ runner.temp }}/benchmark-logs
          DATASET_DIR: ${{ runner.temp }}/benchmark-data
          BENCH_HOST: ${{ secrets.BENCHMARK_SFTP_HOST }}
          BENCH_PORT: ${{ inputs.port || '22' }}
          BENCH_USERNAME: ${{ secrets.BENCHMARK_SFTP_USERNAME }}
          BENCH_PASSWORD: ${{ secrets.BENCHMARK_SFTP_PASSWORD }}
          BENCH_KNOWN_HOSTS: ${{ secrets.BENCHMARK_SFTP_KNOWN_HOSTS }}
        run: |
          "$RUNNER_TEMP/bin/easysftp-bench" standard

      - name: Publish the summary
        if: always()
        run: cat "$RUNNER_TEMP/benchmark-results/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: ignore

      # Everything below stores the result in benchmarks/ on main. A release PR
      # run (pull_request) stops here: nothing has been released yet.
      - name: Check out main for storing
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: store-main
          # Full history: the commit below rebases onto whatever landed on main
          # while the benchmark was running, which a shallow clone cannot do.
          fetch-depth: 0

      - name: Store the result
        if: github.event_name != 'pull_request'
        env:
          BENCH_DIR: store-main/benchmarks
          RESULTS_JSON: ${{ runner.temp }}/benchmark-results/results.json
          SUMMARY_MD: ${{ runner.temp }}/benchmark-results/summary.md
          RESULTS_CSV: ${{ runner.temp }}/benchmark-results/results.csv
          KIND: ${{ inputs.release-version != '' && 'release' || 'manual' }}
          VERSION: ${{ inputs.release-version }}
          LABEL: ${{ steps.resolve.outputs.label }}
          RECORDED_AT: ${{ steps.resolve.outputs.recorded-at }}
          COMMIT: ${{ steps.build.outputs.candidate-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/bin/easysftp-bench" store

      - name: Commit the result to main
        if: github.event_name != 'pull_request'
        working-directory: store-main
        env:
          KIND: ${{ inputs.release-version != '' && 'release' || 'manual' }}
          NAME: ${{ steps.resolve.outputs.label }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: store $KIND benchmark for $NAME"
          # main usually moved on during a run that takes minutes; only new
          # files are added here, so replaying them on top is safe.
          git pull --rebase origin main
          git push origin HEAD:main

  # A release's numbers belong on its release page, next to the binaries. This
  # is a separate job on a GitHub-hosted runner: it needs nothing but "gh" and
  # a checkout, and the self-hosted runner stays reserved for the measurement.
  # It reads the files from main, which the job above pushed there, so it can
  # only run once that finished.
  attach:
    name: Attach the result to the release
    needs: benchmark
    if: inputs.release-version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Upload the benchmark as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          # Renamed for the release page: "release-v3.3.2.json" reads like a
          # second copy of the release next to the binaries, "benchmark-" says
          # what it is. The file in benchmarks/ keeps its own naming.
          cp "benchmarks/releases/release-$VERSION.json" "benchmark-$VERSION.json"
          cp "benchmarks/releases/release-$VERSION.md" "benchmark-$VERSION.md"
          assets=("benchmark-$VERSION.json" "benchmark-$VERSION.md")
          if [ -f "benchmarks/releases/release-$VERSION.csv" ]; then
            cp "benchmarks/releases/release-$VERSION.csv" "benchmark-$VERSION.csv"
            assets+=("benchmark-$VERSION.csv")
          fi
          gh release upload "$VERSION" "${assets[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
